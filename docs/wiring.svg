<text x="70" y="954" font-size="14" fill="#222">• Датчик и микрофон — только от 3V3, не от 5V. Все GND соединены вместе. / Sensor and mic on 3V3 only; all grounds common.</text>
<text x="70" y="979" font-size="14" fill="#222">• Микрофон ставьте подальше от динамика, через поролон — иначе «Alexa» хуже слышно во время музыки. / Keep the mic away from the speaker.</text>
<text x="70" y="1004" font-size="14" fill="#222">• Конденсатор у VIN/GND усилителя убирает хрип и перезагрузки на громких басах (плюсом к VIN). / Bulk cap at the amp stops brown-outs.</text>
<text x="70" y="1029" font-size="14" fill="#222">• GAIN: открыт 9 дБ · на GND 12 дБ · 100 кОм на GND 15 дБ · на VIN 6 дБ. / Gain: open 9 dB, GND 12 dB, VIN 6 dB.</text>
<text x="70" y="1054" font-size="14" fill="#222">• Пунктир — по желанию: кольцо WS2812B (24 светодиода) на GPIO7, прошивка под него пока не добавлена. / Dashed = optional.</text>
